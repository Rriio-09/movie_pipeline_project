name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-cd.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: cluster
  ECR_REPOSITORY: frontend
  FRONTEND_DIR: starter/frontend
  NODE_VERSION: "18.14.2"

jobs:
  lint:
    name: Lint frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: frontend-npm-${{ runner.os }}-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            frontend-npm-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: frontend-npm-${{ runner.os }}-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            frontend-npm-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        env:
          CI: "true"
        run: npm run test -- --watchAll=false

  build:
    name: Build and publish frontend image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate backend application URL secret
        env:
          BACKEND_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}
        run: |
          test -n "${BACKEND_URL}" || {
            echo "Missing GitHub secret: REACT_APP_MOVIE_API_URL"
            exit 1
          }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create immutable image reference
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: echo "uri=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build frontend container with backend URL
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL}" \
            --tag "${IMAGE_URI}" \
            .

      - name: Push frontend container to ECR
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: docker push "${IMAGE_URI}"

  deploy:
    name: Deploy frontend to EKS
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Deploy tagged frontend image
        working-directory: starter/frontend/k8s
        env:
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          kustomize edit set image frontend="${IMAGE_URI}"
          kustomize build | kubectl apply -f -
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Show frontend service status
        run: kubectl get deployment,service,pods -l app=frontend -o wide
